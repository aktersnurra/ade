# Personal workbench: explicitly opts into unrestricted egress.
#
# SmolVM exposes no negative CIDR rules, so "public" cannot exclude private
# ranges. Anything sensitive belongs in a sealed or allowlisted workbench.

name = "personal"
image = "file:/Users/aktersnurra/projects/vibe/gatekeep.workspaces/transport-qualification/artifacts/ade-nix-workstation-0.1.0.tar@sha256:d8db3517d2c8c667b130531741dfbf7a3e71a508442465c585af27de1b0e9234"
smolfile = "smolfiles/workstation.Smolfile"

[resources]
cpus = 4
memory_mib = 8192
overlay_gib = 32
workspace_gib = 128

[network]
posture = "public"

[services]
docker = true
herdr = true

[ssh]
mode = "dedicated_agent"
key_ref = "keychain:ade-personal-ssh"

[backup]
directory = "~/ade-backups/personal"
keep = 3
