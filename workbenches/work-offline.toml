# Offline work workbench: no network, no credentials.
#
# Used for reviewing or running untrusted code that must not reach any endpoint.

name = "work-offline"
image = "file:/Users/aktersnurra/projects/vibe/gatekeep.workspaces/transport-qualification/artifacts/ade-nix-workstation-0.1.0.tar@sha256:cca178a64daed733a401f1fd32e5c0889d1427fed43787a6f7c5e9877185a12b"
smolfile = "smolfiles/workstation.Smolfile"

[resources]
cpus = 4
memory_mib = 8192
overlay_gib = 32
workspace_gib = 128

[network]
posture = "sealed"

[services]
docker = true
herdr = true

[ssh]
mode = "disabled"

[backup]
directory = "~/ade-backups/work-offline"
keep = 3
