# Offline work workbench: no network, no credentials.
#
# Used for reviewing or running untrusted code that must not reach any endpoint.

name = "work-offline"
image = "ade-nix-workstation@sha256:d8db3517d2c8c667b130531741dfbf7a3e71a508442465c585af27de1b0e9234"
smolfile = "smolfiles/workstation.Smolfile"

[resources]
cpus = 4
memory_mib = 8192
overlay_gib = 32
workspace_gib = 128

[network]
posture = "sealed"

[services]
docker = true
herdr = true

[ssh]
mode = "disabled"

[backup]
directory = "~/ade-backups/work-offline"
keep = 3
