# Trusted default Herdr configuration.
#
# This file is part of the image and is reconstructed on reimage. Herdr must
# never read its configuration from /workspace: durable ADE data there is
# schema-validated, non-executable, and may not name commands, hooks, plugins
# or executable paths.

[herdr]
workspace_root = "/workspace"

[herdr.state]
# Runtime state is mutable and is deliberately wiped by reimage.
directory = "/var/lib/herdr"

[herdr.startup]
# Agents are started by the user after attachment, not by the image.
autostart = false
